# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test (dulce-de-leche
# tests/standard_conformance.rs) requires this file to exist.
#
# §4 matrix row (whisper/turu): pretender ✅ · wai ✅ · bd ✅ · ddl ✅

[tools]
wai = "2026.9.28"          # crates.io: wai-cli — installed pinned in ci.yml
pretender = "0.6.0"        # crates.io — installed pinned in ci.yml
bd = "1.3.0"               # beads — pinned GitHub release download
dulce-de-leche = "0.7.0"   # crates.io (bin: ddl) — installed pinned in ci.yml
