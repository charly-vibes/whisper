[package]
name = "whisper-vibes"
version = "0.1.0"
edition = "2024"
description = "Deterministic knowledge workspace management for AI agents — the mechanical half of the whisper skill as a CLI"
license = "MIT"
repository = "https://github.com/charly-vibes/whisper"
keywords = ["llm", "agents", "knowledge", "workspace", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "whisper"

[[bin]]
name = "whisper"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
genesis-vibes = "0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
